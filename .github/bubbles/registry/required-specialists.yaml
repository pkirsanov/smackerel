# bubbles/registry/required-specialists.yaml
#
# Canonical mode -> required delivery-specialist phases (IMP-105 SCOPE-7 / ONT-UNIFY).
#
# SINGLE SOURCE OF TRUTH for the mode->required-specialists mapping that
# state-transition-guard.sh Check 6 ("Specialist Phase Completion", Gate G022)
# enforces. The guard READS this file directly (yq, with a bounded awk parser
# for the flow-style lists so Check 6 still resolves under a minimal PATH).
#
# It used to be duplicated as a hardcoded `case` in the guard that this file
# mirrored, with required-specialists-consistency.sh holding the two in step.
# The duplication and its comparator are gone: there is one copy, so there is
# nothing to diverge.
#
# TO CHANGE a mode's required specialists: edit the list here. A mode absent
# from this file is not fail-open -- the guard derives a requirement from the
# mode's declared phaseOrder (IMP-105 SCOPE-3 fallback).
#
# ORDERING IS SIGNIFICANT. Legacy / currently-unrouted modes (feature-bootstrap,
# batch-*, redesign-existing, product-discovery, ...) are preserved verbatim --
# do NOT drop or "clean up" any entry; that would silently change Gate G022
# enforcement.
#
# The broader 12-primitive unified delivery-policy model (Intent, DeliveryStrategy,
# WorkflowMode, RiskClass, Phase, Gate, Artifact, AgentOwner, EvidenceClaim,
# AchievedAssurance, ReleaseAssuranceFloor, TerminalState) remains the larger
# ONT-UNIFY direction; this registry canonicalizes the one relationship
# (mode -> required specialists) IMP-105 SCOPE-3 deferred to SCOPE-7.
version: 1
modes:
  value-first-e2e-batch: [ implement, test, regression, simplify, stabilize, security, docs, validate, audit, chaos ]
  full-delivery: [ implement, test, regression, simplify, gaps, harden, stabilize, security, validate, audit, chaos, docs ]
  feature-bootstrap: [ implement, test, regression, simplify, stabilize, security, docs, validate, audit ]
  bugfix-fastlane: [ implement, test, regression, simplify, stabilize, security, validate, audit ]
  # IMP-101 SCOPE-5 (FLOW-101): this delivery mode was absent from the table, so
  # Check 6 imposed no specialist-completion requirement on it. Its required
  # specialists are its own declared phaseOrder in modes.yaml ([select,
  # implement, test, validate, docs, finalize]) minus the select/finalize
  # bookends. The read-only modes readiness-review and journey-refinement are
  # intentionally NOT listed: they set allowImplementationForFindings:false and
  # run review/journey phases, so a delivery-specialist requirement would be
  # incorrect for them.
  rapid-tool-delivery: [ implement, test, validate, docs ]
  chaos-hardening: [ chaos, implement, test, regression, simplify, stabilize, security, validate, audit, docs ]
  harden-to-doc: [ harden, implement, test, regression, simplify, stabilize, security, chaos, validate, audit, docs ]
  gaps-to-doc: [ gaps, implement, test, regression, simplify, stabilize, security, chaos, validate, audit, docs ]
  harden-gaps-to-doc: [ harden, gaps, implement, test, regression, simplify, stabilize, security, chaos, validate, audit, docs ]
  reconcile-to-doc: [ implement, test, regression, simplify, stabilize, security, validate, audit, chaos, docs ]
  test-to-doc: [ test, validate, audit, docs ]
  chaos-to-doc: [ chaos, validate, audit, docs ]
  batch-implement: [ implement, test, regression, simplify, stabilize, security, docs, validate, audit, chaos ]
  batch-harden: [ harden, implement, test, regression, simplify, stabilize, security, validate, audit, chaos, docs ]
  batch-gaps: [ gaps, implement, test, regression, simplify, stabilize, security, validate, audit, chaos, docs ]
  batch-harden-gaps: [ harden, gaps, implement, test, regression, simplify, stabilize, security, validate, audit, chaos, docs ]
  batch-improve-existing: [ harden, gaps, implement, test, regression, simplify, stabilize, security, validate, audit, chaos, docs ]
  batch-reconcile-to-doc: [ implement, test, validate, audit, chaos, docs ]
  product-to-delivery: [ implement, test, regression, simplify, stabilize, security, docs, validate, audit, chaos ]
  improve-existing: [ harden, gaps, implement, test, regression, simplify, stabilize, security, validate, audit, chaos, docs ]
  redesign-existing: [ implement, test, regression, simplify, stabilize, security, docs, validate, audit, chaos ]
  stabilize-to-doc: [ stabilize, implement, test, regression, simplify, security, chaos, validate, audit, docs ]
  security-to-doc: [ security, implement, test, regression, simplify, stabilize, devops, chaos, validate, audit, docs ]
  regression-to-doc: [ regression, implement, test, simplify, stabilize, devops, security, chaos, validate, audit, docs ]
  simplify-to-doc: [ simplify, test, validate, audit, docs ]
  iterate: [ validate, audit ]
  stochastic-quality-sweep: [ validate, audit ]
  product-discovery: [ harden, docs, validate, audit ]
  validate-to-doc: [ validate, audit, docs ]
