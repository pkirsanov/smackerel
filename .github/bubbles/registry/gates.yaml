  G093:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: delivery_implementation_delta_gate
    classification: hybrid
    enforcedBy: [ script:bubbles/scripts/delivery-implementation-delta-guard-selftest.sh, script:bubbles/scripts/delivery-implementation-delta-guard.sh ]
    description: >-
      BLOCKING gate. Done-ceiling delivery modes MUST prove real implementation/runtime/config/contract/test/docs delta outside planning bookkeeping paths (`specs/**` and `.specify/**`) before certification can reach `done`. G053 remains the Code Diff Evidence shape check; G093 consumes git diff paths and/or G053-compatible report Code Diff Evidence, classifies changed paths as planning-only/source/runtime/config/contract/test/docs/other, and blocks spec-only delivery runs with a blocked RESULT-ENVELOPE that includes changed-path classification plus next-owner routing to implementation/test/docs or a below-done planning-only downgrade. Planning-only and docs-only modes with status ceilings below `done` are exempt from G093; `specs_hardened` planning packets remain governed by G087 linkage. Enforced mechanically by `bubbles/scripts/delivery-implementation-delta-guard.sh`, which exits 0 (clean or lower-ceiling exemption), 1 (G093 delivery delta violation), or 2 (runtime error / malformed input / bad refs). State-transition-guard.sh invokes this guard as Check 29B after G087 and before final promotion. Hermetic selftest: `bubbles/scripts/delivery-implementation-delta-guard-selftest.sh`. Persistent regression: `tests/regression/test_17_delivery_implementation_delta.sh`. Wired into `bubbles/scripts/framework-validate.sh`.
  G094:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: capability_foundation_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/capability-foundation-guard-selftest.sh, script:bubbles/scripts/capability-foundation-guard.sh ]
    description: >-
      BLOCKING gate. Capability-first design applies when proportionality triggers are present: a brand-new capability with no existing foundation, the second or later concrete implementation/provider/component/variant, adapter/provider/strategy/plugin/channel/driver/connector/variant language, or shared UI/data/contract surface across two or more screens/features/services. Detection uses keyword scans across planning artifacts plus `## Concrete Implementations` entry counts. When applicable, spec.md MUST contain `## Domain Capability Model` or a non-empty `### Single-Capability Justification`; design.md MUST contain `## Capability Foundation`, `## Concrete Implementations`, and `### Variation Axes` with at least two axes, or a non-empty `### Single-Implementation Justification`; multi-screen/reusable UI work MUST include `### UI Primitives` or a non-empty `### Single-Screen Justification`; and split designs MUST plan a `foundation:true` scope that overlay/provider scopes reference in `Depends On`. Specs with `state.json.createdAt` earlier than 2026-05-25 are grandfathered until touched or recertified. Enforced mechanically by `bubbles/scripts/capability-foundation-guard.sh`, which exits 0 (clean/not applicable/grandfathered), 1 (G094 findings), or 2 (malformed input). State-transition-guard.sh invokes this guard as Check 34. Hermetic selftest: `bubbles/scripts/capability-foundation-guard-selftest.sh`. Persistent regression: `tests/regression/test_18_capability_foundation_gate.sh`. Wired into `bubbles/scripts/framework-validate.sh`.
  G095:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: discovered_issue_disposition_gate
    classification: hybrid
    enforcedBy: [ script:bubbles/scripts/discovered-issue-disposition-guard-selftest.sh, script:bubbles/scripts/discovered-issue-disposition-guard.sh ]
    description: >-
      BLOCKING gate. Every issue an agent observes during work MUST have an explicit disposition (`fixed-in-session`, `bug-filed`, `spec-filed`, `ops-filed`, `routed`, or `status-adjusted`) DISCHARGED THE SAME TURN it is observed — the tracked artifact (bug folder, spec, ops ticket, transition packet, or an immediate spec/scope/DoD status flip) MUST exist on disk now. Saying "pre-existing", "unrelated", "out of scope", or "not my session" without filing a corresponding artifact is forbidden and counts as fabrication. Filing is NOT user-gated: an agent MUST NOT hand the user a list of unfiled findings to authorize — "recommend filing", "should be filed", "defer filing to a future workflow", and "awaiting/pending user approval" are report-and-wait violations. Enforced mechanically by `bubbles/scripts/discovered-issue-disposition-guard.sh`, which scans the active spec's `report.md` and the most recent RESULT-ENVELOPE narrative (when supplied) for forbidden deferral / report-and-wait phrases. When a forbidden phrase is detected, the guard requires either (a) the same paragraph to cite a concrete artifact reference (`specs/.../bug.md`, `specs/.../spec.md`, `transitionRequests` entry, ops ticket URL), or (b) a `## Discovered Issues` section in `report.md` whose most recent `Observed` row is today. The guard exits 0 (clean), 1 (G095 findings), or 2 (runtime error / malformed input). State-transition-guard.sh invokes this guard as Check 35. Hermetic selftest: `bubbles/scripts/discovered-issue-disposition-guard-selftest.sh`. See `agents/bubbles_shared/operating-baseline.md` → "Discovered-Issue Disposition" for the full disposition table, the file-on-discovery / no-report-and-wait rule, and report.md shape.
  G097:
    since: "7.4.0"
    sinceDate: "2026-06-08"
    name: requirement_mechanism_correspondence_gate
    classification: hybrid
    enforcedBy: [ script:bubbles/scripts/requirement-mechanism-guard-selftest.sh, script:bubbles/scripts/requirement-mechanism-guard.sh ]
    description: >-
      BLOCKING gate (warn-and-require-justification). Closes the shape-not-semantics hole where a requirement that names a concrete mechanism (PKCE, OAuth2, refresh_token, CSRF, HMAC, mTLS, SAML, WebAuthn, TOTP, Content-Security-Policy, HSTS, Idempotency-Key) can certify green even though the implementation never implements that mechanism. G021 verifies a command RAN (tests can pass against a fake), G028 verifies a real call is MADE (a real call with the wrong auth passes), and traceability-guard verifies a test EXISTS (not that it asserts the correct behavior) — none verify requirement-to-code correspondence. This gate pulls the reconcile/gaps sweep's proven check ("a requirement names a mechanism → grep the code for it") forward into certification. For each mechanism token named in `spec.md`/`design.md`/scope files, the guard greps the scope's declared implementation files (same backtick-path extraction as G028) for the mechanism or a known synonym. A named mechanism is cleared by EITHER code evidence OR an explicit disclosure — a `## Requirement-Mechanism Justifications` section (in `spec.md` or `report.md`) or a `Mechanism-Justification: <mechanism> — <reason>` line — so a legitimate differently-named mechanism is never blocked; only a mechanism named with NEITHER code evidence NOR a justification is a finding. This is honest disclosure over mechanical green. Two advisory NUDGES never change the exit code: (#4) a security mechanism named with no negative/rejection assertion in the scope's tests, and (#3) a live-tier (integration/e2e) test backed only by an in-process fake server (`httptest.Server`/`MockWebServer`/`WireMock`) that does not exercise the real external contract. GRANDFATHER CLAUSE: specs whose `state.json.createdAt` is absent or earlier than 2026-06-08 are WARN-only so framework upgrades never retroactively block closed work; only specs created on/after the cutoff get blocking enforcement. Enforced mechanically by `bubbles/scripts/requirement-mechanism-guard.sh`, which exits 0 (clean / not applicable / grandfathered), 1 (G097 finding), or 2 (runtime error / malformed input). State-transition-guard.sh invokes this guard as Check 36. Hermetic selftest: `bubbles/scripts/requirement-mechanism-guard-selftest.sh`. Persistent regression: `tests/regression/test_19_requirement_mechanism.sh`. Wired into `bubbles/scripts/framework-validate.sh`.

  # ─────────────────────────────────────────────────────────────────────────
  # OBSERVABILITY POSTURE + SLO GATES (G098-G100)
  # Introduced with IMP-001 (observability as a first-class citizen). Posture
  # is a MANDATORY, first-class decision; wiring is optional. Enforced by
  # bubbles/scripts/observability-posture-guard.sh,
  # bubbles/scripts/observability-opt-out-guard.sh, and
  # bubbles/scripts/observability-slo-guard.sh (G100 — the SLO teeth, SCOPE-4).
  # ─────────────────────────────────────────────────────────────────────────
  G098:
    since: "7.10.0"
    sinceDate: "2026-06-11"
    name: observability_posture_declared_gate
    classification: hybrid
    enforcedBy: [ script:bubbles/scripts/observability-posture-guard-selftest.sh, script:bubbles/scripts/observability-posture-guard.sh ]
    description: >-
      WARN-LEVEL gate (project-flippable to blocking). Observability posture is a first-class decision: every repo SHOULD declare `traceContracts.observability.posture` (`wired` or `opted-out`) in `bubbles-project.yaml` (or `.github/bubbles-project.yaml`). An UNDECLARED posture emits a WARN nag and exits 0 by DEFAULT; it is flipped to a hard block (exit 1) only when the project sets `traceContracts.observability.policy.undeclaredPosture: block`. The guard ALSO fails loud (exit 1) on three malformed/unsafe shapes so the contract is never silently mis-parsed: (1) fake-wired — `posture: wired` but EVERY validate+operate signal is `adapter: none` (no usable evidence path, INV-14); (2) opted-out-malformed — `posture: opted-out` with NO `optOut` block (a missing optOut/revisitAfter would make the G099 freshness gate a silent no-op); (3) unsupported `schemaVersion` — checked BEFORE any posture semantics (INV-13). The Bubbles framework SOURCE checkout is auto-exempt (no runtime to monitor) and resolves permanently to EXEMPT (no-runtime) with NO nag, replicating the intent of `is_framework_repo()` keyed to the scanned root. Parser dependency is `yq` (mikefarah v4); because this is a WARN-level gate, a MISSING parser WARN-and-skips (exit 0) rather than hard-erroring. There is NO `--skip`/`--force`/`--ignore` bypass; the only project knob is `policy.undeclaredPosture`. A read-only `--print-state` mode surfaces the resolved posture for `bubbles doctor` (ADVISORY — it never changes doctor's pass/fail exit code). Enforced mechanically by `bubbles/scripts/observability-posture-guard.sh` (exit 0 = declared/well-formed or undeclared+warn or EXEMPT or parser-missing; exit 1 = fake-wired / opted-out-malformed / unsupported-schema / invalid-posture / malformed-YAML / undeclared+policy-block; exit 2 = usage). Hermetic selftest: `bubbles/scripts/observability-posture-guard-selftest.sh`. Wired into `bubbles/scripts/framework-validate.sh` (selftest + live guard). Owned by `bubbles.setup` (posture proposal) + every agent (declaration discipline). Reference: improvements/IMP-001-observability-first-class.md (SCOPE-2).
  G099:
    since: "7.10.0"
    sinceDate: "2026-06-11"
    name: observability_opt_out_freshness_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/observability-opt-out-guard-selftest.sh, script:bubbles/scripts/observability-opt-out-guard.sh ]
    description: >-
      WARN-LEVEL gate. When `traceContracts.observability.posture: opted-out`, the opt-out MUST be RECORDED and EXPIRING: `optOut.reasonCode`, `optOut.reason`, and `optOut.revisitAfter` are all REQUIRED, and a missing/empty one is malformed = fail loud (exit 1) — a missing `revisitAfter` would otherwise make this guard a silent no-op. `revisitAfter` is AUTHORITATIVE and is NEVER re-derived from `reasonCode` (reasonCode only seeded the setup-proposed default). When the committed `revisitAfter` is in the PAST, the guard emits a route-required opt-in reminder pointing at `/bubbles.setup focus: observability`; this is a NON-BLOCKING WARN by default (exit 0) — an expired opt-out escalates a reminder, it does not hard-fail a build. Unsupported `schemaVersion` fails loud (exit 1) BEFORE any opt-out semantics (INV-13). Posture other than opted-out is a clean no-op; the Bubbles framework SOURCE checkout is auto-exempt; a MISSING `yq` parser WARN-and-skips (exit 0). There is NO `--skip`/`--force`/`--ignore` bypass. Enforced mechanically by `bubbles/scripts/observability-opt-out-guard.sh` (exit 0 = not-opted-out / fresh / expired-reminder / EXEMPT / parser-missing; exit 1 = missing required optOut field / unparseable revisitAfter / unsupported-schema / malformed-YAML; exit 2 = usage). Hermetic selftest: `bubbles/scripts/observability-opt-out-guard-selftest.sh`. Wired into `bubbles/scripts/framework-validate.sh` (selftest + live guard). Owned by `bubbles.setup` (opt-out proposal) + `bubbles.upkeep` (wired prod slo-review only; committed-config reminders stay here). Reference: improvements/IMP-001-observability-first-class.md (SCOPE-2).
  G100:
    since: "7.10.0"
    sinceDate: "2026-06-11"
    name: observability_slo_evidence_gate
    classification: hybrid
    enforcedBy: [ script:bubbles/scripts/observability-slo-guard-selftest.sh, script:bubbles/scripts/observability-slo-guard.sh ]
    description: >-
      BLOCKING gate — the TEETH of the observability posture model. When `traceContracts.observability.posture: wired` AND an *instrumented scope* (a Test Plan row declaring `observabilityWorkflow: <workflow>`) targets a `traceContracts.workflows.<workflow>` that carries an `slo:` link, this gate asserts the CAPTURED SLO evidence at `.specify/runtime/observability/<workflow>.slo.json` MEETS the env-agnostic contract target in `traceContracts.observability.slos.<sloKey>` (observed latencyP99Ms <= target, observed errorRatePct <= target, observed availabilityPct >= target). A metric the contract DECLARES but the captured `observed` block OMITS is a BREACH, not a silent skip — a dropped measurement cannot prove an SLO met (R2-G adversarial hardening). Malformed evidence JSON, evidence missing the `observed` block, and evidence captured for the WRONG workflow are all rejected (exit 1, fail loud) BEFORE any numeric comparison. NO-OP (exit 0) when posture != wired (opted-out / undeclared), when no scope declares an `observabilityWorkflow`, or when no instrumented workflow carries an `slo:` link. The Bubbles framework SOURCE checkout is auto-exempt (no runtime to monitor; no persistent `specs/` under G085) and resolves to EXEMPT (no-runtime) no-op, replicating the intent of `is_framework_repo()` keyed to the scanned root. Parser dependency is `yq` (mikefarah v4) + `jq`; because this is a BLOCKING gate, a MISSING parser FAILS CLOSED (exit 1) with an actionable 'install jq/yq' message rather than silently passing. There is NO `--skip`/`--force`/`--ignore` bypass — if captured telemetry breaches the contract, fix the instrumentation or the system, not the gate. DIVISION OF LABOR with G026 (`sla_stress_coverage_gate`): G026 ensures the stress/load TEST EXISTS and cites the `traceContracts.observability.slos` registry entry; G100 ensures the CAPTURED EVIDENCE MEETS the target — the same DoD item is never enforced twice. Enforced mechanically by `bubbles/scripts/observability-slo-guard.sh` (exit 0 = EXEMPT / no-config / posture!=wired / no instrumented-with-slo workflow / all instrumented SLOs within target; exit 1 = missing-parser fail-closed / unsupported schemaVersion / malformed YAML / missing evidence / malformed evidence / wrong-workflow evidence / SLO breach; exit 2 = usage). Hermetic selftest: `bubbles/scripts/observability-slo-guard-selftest.sh` (within-target / breached / opted-out no-op / no-observabilityWorkflow no-op / missing-evidence gap / malformed JSON / missing-observed / wrong-workflow / missing-parser fail-closed / framework-exempt, plus two ADVERSARIAL proofs: a regressed observed value FAILS, and a removed contract-declared metric FAILS). Wired into `bubbles/scripts/framework-validate.sh` (selftest + live guard). Owned by `bubbles.validate` (certification) with planning support from `bubbles.plan` (instrumented Test Plan rows). Reference: improvements/IMP-001-observability-first-class.md (SCOPE-4).

  # ─────────────────────────────────────────────────────────────────────────
  # RELEASE DELIVERY RECONCILIATION GATE (G101)
  # Introduced with IMP-006. Closes the scenario-level "claimed delivered /
  # actually skipped" hole — reconciles the PROMISED required-feature set in
  # docs/releases/<phase>/features.md against the DELIVERED (terminal +
  # validate-certified) spec truth. Enforced by
  # bubbles/scripts/release-delivery-reconciliation-guard.sh.
  # ─────────────────────────────────────────────────────────────────────────
  G101:
    since: "7.12.0"
    sinceDate: "2026-06-12"
    name: release_delivery_reconciliation_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/is-terminal-for-mode.sh, script:bubbles/scripts/release-delivery-reconciliation-guard-selftest.sh, script:bubbles/scripts/release-delivery-reconciliation-guard.sh, script:bubbles/scripts/scenario-compile-lint.sh ]
    description: >-
      BLOCKING gate (reconciled-packet / scenario path) — WARN-grandfathered otherwise. Closes the scenario-level "claimed delivered / actually skipped" hole (IMP-006): per-spec gates (G021/G024/G025/G028/G029/G097 + downstream repo lints) only fire for specs that EXIST and are routed through validate, so a release phase can promise features in `docs/releases/<phase>/features.md` that were never specced (no per-spec gate ever fires) OR specced-but-implement-self-certified. This gate reconciles the PROMISED required-feature set against the DELIVERED (terminal + validate-certified) spec truth. Each feature carries an HTML-comment machine binding authored by `bubbles.releases` inside `features.md`: `<!-- bubbles:feature id=<id> spec=<spec-dir|none> delivery=required|optional|carried|deferred-to:<phase> -->`, with a packet opt-in header `<!-- bubbles:reconciled-packet schemaVersion=1 phase=<phase> -->`. For every `delivery=required` feature the guard verifies (1) the bound spec dir exists with a parseable `state.json`, (2) status is TERMINAL (`done` or the spec's `workflowMode` ceiling via `is-terminal-for-mode.sh`; `in_progress`/`not_started`/`blocked`/`done_with_concerns` are NOT terminal), and (3) the spec is VALIDATE-certified — `validate` appears in `certification.certifiedCompletedPhases[]` (v3) or top-level `completedPhases[]` (legacy) — so an implement self-certification with `validate` absent is a finding. POSTURE: a packet is RECONCILED (blocking) when it carries the `bubbles:reconciled-packet` header OR the guard is invoked with `--require-coverage` (the `bubbles.goal`/`bubbles.sprint` convergence path for a release-phase scenario); otherwise it is GRANDFATHERED (WARN-only, exit 0) so existing downstream packets backfill at their pace. FAIL-LOUD on malformed: a reconciled packet that binds nothing, an annotation missing `id`/`spec`/`delivery`, a duplicate id, an invalid `delivery` value, or a `required` feature with `spec=none` all exit 1 (a missing field must never make the gate a silent no-op). A required feature whose spec is legitimately `blocked` with a populated `blockedReason` is reported NOT-DELIVERED (blocked) — distinct from silently-skipped — and still blocks a release-phase success claim. The Bubbles framework SOURCE checkout is auto-exempt (no `docs/releases/<phase>/features.md`) and resolves EXEMPT (exit 0), mirroring the observability G098-G100 auto-exempt pattern. Parser dependency is `jq`. There is NO `--skip`/`--force`/`--ignore` bypass; the only knob is the opt-in header / `--require-coverage` trigger. `scenario-compile-lint.sh` enforces the same concern at compile time: a scenario whose `rootOutcome.targetReleasePacket` names a phase MUST cover every required feature with a delivery node (cites G101). Enforced mechanically by `bubbles/scripts/release-delivery-reconciliation-guard.sh` (exit 0 = clean/warn/exempt, 1 = violation, 2 = usage). Hermetic selftest: `bubbles/scripts/release-delivery-reconciliation-guard-selftest.sh` (12 adversarial scenarios including the downstream promised-but-unspecced replay). Wired into `bubbles/scripts/framework-validate.sh` (selftest + live guard). Owned by `bubbles.releases` (annotations + committed audit note) and `bubbles.goal`/`bubbles.sprint` (convergence enforcement). Reference: improvements/IMP-006-release-delivery-reconciliation.md.

  # ─────────────────────────────────────────────────────────────────────────
  # RELEASE TRAIN + UPKEEP GATES (G110-G120)
  # Introduced with bubbles.train (DVS) and bubbles.upkeep (Treena Lahey).
  # Enforced by bubbles/scripts/release-train-guard.sh and
  # bubbles/scripts/env-pollution-scan.sh, plus per-mode constraints in the
  # release-train-* and upkeep-* workflow modes.
  # ─────────────────────────────────────────────────────────────────────────
  G110:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: release_train_discipline_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/release-train-guard.sh ]
    description: >-
      BLOCKING gate. Every spec under `specs/` in `in_progress` or any train-related terminal status (`train_cut`, `train_promoted`) MUST declare `releaseTrain: <id>` in `state.json` referring to an existing train id in `config/release-trains.yaml`. GRANDFATHER CLAUSE: pre-existing `done` / `specs_hardened` / `delivered_pending_activation` specs without `releaseTrain` are WARN only (operators backfill at their pace). Every train MUST have valid `phase` (`active|maintained|frozen|retired`) and `target_slot` (`prod|staging|home-lab|none`). Enforced by `bubbles/scripts/release-train-guard.sh`. Owned by `bubbles.train`.
  G111:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: flag_default_off_on_other_trains_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/release-train-guard.sh ]
    description: >-
      BLOCKING gate. For every spec with `state.json.flagsIntroduced: [<flag>...]` on `releaseTrain: <owning-train>`, each flag MUST be default-OFF in every OTHER train's `config/feature-flags.<train>.yaml` bundle (`flag: false`). Default-ON allowed only in the owning train. Enforced by `bubbles/scripts/release-train-guard.sh`. Owned by `bubbles.train`.
  G112:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: backup_evidence_required_gate
    classification: hybrid
    enforcedBy: [ mode-required ]
    description: >-
      BLOCKING gate. `release-train-promote` MUST verify a recent successful `backup` ledger entry within the cadence declared in `config/upkeep-calendar.yaml`. Enforced via mode constraint + read of `/srv/backups/upkeep-ledger.jsonl` (knb-side). Owned by `bubbles.train` (read) + `bubbles.upkeep` (write).
  G113:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: restore_drill_evidence_gate
    classification: hybrid
    enforcedBy: [ mode-required ]
    description: >-
      BLOCKING gate. `release-train-promote` MUST verify a recent successful `restore-test` ledger entry within the cadence declared in `config/upkeep-calendar.yaml`. Failed restore-drill blocks next promote for that product. Owned by `bubbles.upkeep`.
  G114:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: bcdr_evidence_gate
    classification: hybrid
    enforcedBy: [ mode-required ]
    description: >-
      BLOCKING gate for `prod`-slot promotes. `release-train-promote` to `prod` MUST verify a recent successful quarterly `bcdr-drill` ledger entry. WARNING (not blocking) when `OFFSITE_BACKEND=local-only` because true BCDR requires backups not on the source host. Owned by `bubbles.upkeep`.
  G115:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: env_pollution_isolation_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/env-pollution-scan.sh ]
    description: >-
      BLOCKING gate. Test code (integration, e2e-api, e2e-ui, stress, load, chaos) MUST NEVER write to prod monitoring (prometheus pushgateway labeled `env=prod|home-lab`, loki tenant `prod|home-lab`), prod backup paths (`/srv/backups/*`), knb manifest pointers (`<product>/<target>/manifest.yaml`), or train config (`config/release-trains.yaml`, `config/feature-flags.<train>.yaml`). Enforced by `bubbles/scripts/env-pollution-scan.sh`. Owned by `bubbles.upkeep` (policy) + every agent (no-write discipline).
  G116:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: offsite_backup_required_for_prod_trains_gate
    classification: businessInvariant
    enforcedBy: [ mode-required ]
    description: >-
      Conditional BLOCKING gate. When `config/release-trains.yaml` declares `offsite_required: true` for a train shipping to `prod` slot, `release-train-promote` MUST verify `OFFSITE_BACKEND` is NOT `local-only`. WARNING when `offsite_required: false` (default). Operator flips the switch when USB drives or cloud offsite become available. Owned by `bubbles.train` (gate) + `bubbles.upkeep` (offsite verification).
  G117:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: audit_trail_immutable_gate
    classification: businessInvariant
    enforcedBy: [ mode-required ]
    description: >-
      BLOCKING gate. `/srv/backups/upkeep-ledger.jsonl` is append-only. Rewriting, deleting, or editing past entries is forbidden. Manifest commits via `bubbles.train` follow the same discipline — promote/rollback/retire operations write atomic forward commits, never force-push or rewrite history. Owned by `bubbles.upkeep` (ledger) + `bubbles.train` (manifest).
  G118:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: backup_retention_declared_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/release-train-guard.sh ]
    description: >-
      BLOCKING gate. Every train in `config/release-trains.yaml` MUST declare a `retention` field (string, e.g. `7d-daily,4w-weekly,12m-monthly`). Defaults declared under `defaults.retention` apply when per-train `retention` is omitted. Enforced by `bubbles/scripts/release-train-guard.sh`. Owned by `bubbles.train`.
  G119:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: secret_rotation_recorded_gate
    classification: businessInvariant
    enforcedBy: [ mode-required ]
    description: >-
      BLOCKING gate. Every `upkeep-secret-rotation` ledger entry MUST record old/new key-id HASHES (e.g. `sha256:<first-12-chars>`), NEVER the secret values themselves. Engine refuses to write entries containing high-entropy strings that match secret-value heuristics. Owned by `bubbles.upkeep`.
  G120:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: pii_classification_declared_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/release-train-guard.sh ]
    description: >-
      BLOCKING gate. Every train in `config/release-trains.yaml` MUST declare a `pii` field (`none|pseudonymized|encrypted-only`). Defaults declared under `defaults.pii` apply when per-train `pii` is omitted. Backup ledger entries inherit the train's PII classification. Enforced by `bubbles/scripts/release-train-guard.sh`. Owned by `bubbles.train`.

  # ─────────────────────────────────────────────────────────────────────────
  # CROSS-TRAIN PROPAGATION GATES (G121-G123)
  # Introduced with bubbles.propagate (J-Roc). Enforced by
  # bubbles/scripts/propagation-policy-guard.sh.
  # ─────────────────────────────────────────────────────────────────────────
  G121:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: propagation_policy_declared_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/propagation-policy-guard.sh ]
    description: >-
      BLOCKING gate. When a repo runs a `propagate-forward` / `propagate-backport` / `propagate-audit` workflow, `propagation-policy.yaml` (root or `config/`) MUST exist, parse, and reference only trains declared in `config/release-trains.yaml`. Enforced by `bubbles/scripts/propagation-policy-guard.sh`. Owned by `bubbles.propagate`.
  G122:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: propagation_validation_required_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/propagation-policy-guard.sh ]
    description: >-
      BLOCKING gate. Every edge in `defaultFlow[]` MUST declare `receivingTrainValidationMode` (`validate-only|full-delivery|none`). Edges using `none` MUST declare `validationSkipReason`. Forward and backport operations MUST route the receiving train through the declared validation mode before recording the ledger entry. Owned by `bubbles.propagate`.
  G123:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: propagation_ledger_recorded_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/propagation-policy-guard.sh ]
    description: >-
      BLOCKING gate. Every successful forward/backport operation MUST append one JSONL line to `propagation-ledger.yaml` (or path declared in policy). Ledger is append-only; rewriting past entries is forbidden (G117 audit-trail-immutable applies). Backport entries MUST include `approvalToken` referencing the human approval. Owned by `bubbles.propagate`.

  # ─────────────────────────────────────────────────────────────────────────
  # INCIDENT FASTLANE GATE (G124)
  # Introduced with the incident-fastlane workflow mode + severity tagging
  # in bubbles.stabilize.
  # ─────────────────────────────────────────────────────────────────────────
  G124:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: incident_severity_declared_gate
    classification: businessInvariant
    enforcedBy: [ mode-required ]
    description: >-
      BLOCKING gate for the `incident-fastlane` workflow mode. bubbles.stabilize MUST classify each finding with a severity tag (`incident`/`high`/`medium`/`low`) before the verdict is recorded. At least one `incident` finding REQUIRES emitting a `route_required` packet to `bubbles.train` with `action: rollback` — stabilize MUST NOT perform rollback inline. Owned by `bubbles.stabilize` (classification) + `bubbles.train` (rollback authority).

  # ─────────────────────────────────────────────────────────────────────────
  # FRAMEWORK SELF-OBSERVATION GATE (G125)
  # Introduced with `bubbles.retro target: framework` and the
  # `framework-health` workflow mode.
  # ─────────────────────────────────────────────────────────────────────────
  G125:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: framework_health_evidence_gate
    classification: modelCompensation
    retireWhen: { minTier: opus-class, metric: framework-evidence-omission-rate, threshold: 0.01, window: 30 }
    enforcedBy: [ script:bubbles/scripts/framework-health-evidence-lint.sh, script:bubbles/scripts/retro-framework-health.sh ]
    description: >-
      BLOCKING gate for the `framework-health` workflow mode. `bubbles.retro target: framework` MUST emit an improvement proposal under `improvements/IMP-NNN-<slug>.md` referencing the input data sources analyzed (`.specify/runtime/framework-events.jsonl`, `workflow-runs.json`, `bubbles/capability-ledger.yaml`). The proposal MUST NOT auto-mutate `bubbles/*`, `agents/*`, or `bubbles/workflows.yaml` — proposal-first, human reviewed. Generated by `bubbles/scripts/retro-framework-health.sh` (which writes only to `improvements/`) and independently VERIFIED by `bubbles/scripts/framework-health-evidence-lint.sh`, which re-derives index presence, declared status, evidence citation, index row, generator containment, and proposal traceability. Owned by `bubbles.retro`.

  # ──────────────────────────────────────────────────────────────────────────
  # MODEL-TIER FLOOR GATE (G126)
  # Introduced with v6.1 / S9 (review R4). Promotes the v5.1 model-tier
  # advisory to blocking for high-stakes phases. Enforced by
  # bubbles/scripts/model-tier-advisory.sh.
  # ──────────────────────────────────────────────────────────────────────────
  G126:
    since: "6.1.0"
    sinceDate: "2026-06-06"
    name: model_tier_floor_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/model-tier-advisory-selftest.sh, script:bubbles/scripts/model-tier-advisory.sh ]
    description: >-
      BLOCKING gate for high-stakes phases. When a mode declares a `modelFloor` for a phase listed in `modeDefaults.modelFloorEnforcedPhases` (default: audit, security, validate), the active model reported via `BUBBLES_ACTIVE_MODEL` MUST meet or exceed that floor. `model-tier-advisory.sh check` exits non-zero (blocking) for an enforced phase when the active model is known and below floor, and remains advisory (warning, exit 0) for all other phases. It NEVER false-blocks when the model identifier is unknown or no floor is declared, so new model releases are not penalized. Tiers (low → high): haiku-class < sonnet-class < opus-class. Enforced by `bubbles/scripts/model-tier-advisory.sh` (with `--enforce` or list-driven) and its hermetic selftest `model-tier-advisory-selftest.sh`. Owned by `bubbles.workflow` (calls the check before each enforced phase).

  # ──────────────────────────────────────────────────────────────────────────
  # CAPABILITY-CONSUMER FRESHNESS GATE (G127)
  # Introduced with IMP-004. Applies the G029 integration-completeness standard
  # to the framework's OWN capability ledger (the framework stops exempting
  # itself from the no-orphan rule it enforces downstream). Enforced by
  # bubbles/scripts/capability-consumer-freshness.sh.
  # ──────────────────────────────────────────────────────────────────────────
  G127:
    since: "7.11.0"
    sinceDate: "2026-06-11"
    name: capability_consumer_freshness_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/capability-consumer-freshness-selftest.sh, script:bubbles/scripts/capability-consumer-freshness.sh ]
    description: >-
      BLOCKING gate (framework-source self-validation). Closes the IMP-001 R2-B "orphan foundation" failure mode: the framework held its downstream consumers to G029 (integration-completeness — every shipped artifact has a real consumer) while exempting its OWN `bubbles/capability-ledger.yaml`. This gate applies the same standard to the ledger: every capability with `state: shipped` MUST declare a non-empty `consumers:` list, AND every listed consumer path MUST exist on disk. `partial`/`proposed`/`deprecated` capabilities are exempt (no-op). This is an EXISTENCE check (the G029 standard): it proves each declared consumer file is present, not that it textually references the owner surface — authoring discipline (choose consumers that genuinely invoke the owner) is the human contract, and a future semantic-grep enhancement (the G097-style "named token → grep the code" check) can layer on without changing this gate's contract. A repo with no `bubbles/capability-ledger.yaml` (every downstream product checkout — the ledger is a framework-source-only artifact) no-ops (exit 0) via a parser-free pre-check that runs BEFORE the fail-closed parser gate. Parser dependency is `yq` (mikefarah v4); because this is a BLOCKING gate, a MISSING parser FAILS CLOSED (exit 1) with an actionable "install yq" message rather than silently passing — but ONLY for a repo that actually HAS the ledger. There is NO `--skip`/`--force`/`--ignore` bypass; an orphan shipped capability is a real finding — wire a consumer or downgrade the `state`. Enforced mechanically by `bubbles/scripts/capability-consumer-freshness.sh` (exit 0 = no ledger / all shipped capabilities have existing consumers; exit 1 = missing parser when a ledger is present / orphan shipped capability / dangling consumer path; exit 2 = usage). Hermetic selftest: `bubbles/scripts/capability-consumer-freshness-selftest.sh`. Wired into `bubbles/scripts/framework-validate.sh` (selftest + live guard). Reference: improvements/IMP-004-capability-consumer-freshness.md.

  # ──────────────────────────────────────────────────────────────────────────
  # SESSION-CAP ENFORCEMENT GATE (G128)
  # Introduced with IMP-003 SCOPE-2. Promotes the advisory `sessionBudget` caps
  # to mechanical enforcement — the AGGREGATE (whole-session) sibling of G082's
  # per-(specDir, agent) convergence cap. Enforced by
  # bubbles/scripts/session-cap-guard.sh.
  # ──────────────────────────────────────────────────────────────────────────
  G128:
    since: "7.17.0"
    sinceDate: "2026-07-03"
    name: session_cap_enforcement_gate
    classification: modelCompensation
    retireWhen: { minTier: sonnet-class, metric: process-violation-rate, threshold: 0.02, window: 20 }
    enforcedBy: [ script:bubbles/scripts/session-cap-guard-selftest.sh, script:bubbles/scripts/session-cap-guard.sh ]
    description: >-
      BLOCKING gate. Mechanically enforces the IMP-003 `sessionBudget` aggregate safety caps for a whole goal/sprint session — the AGGREGATE sibling of Gate G082. Where G082 caps convergence iterations PER (specDir, agent) using `maxConvergenceIterations` from `bubbles/workflows.yaml`, G128 caps the AGGREGATE usage across the WHOLE session (every spec, every agent) using a `sessionBudget` object recorded in `.specify/memory/bubbles.session.json` with seven dimensions: `maxTotalConvergenceIterations` (aggregate sum of `convergenceLoops[].iterationCount`), `maxWallClockMinutes` (earliest → latest `turnSnapshots[].timestamp`, in minutes), `maxToolCalls` (aggregate `toolCallCount` counter), and the four context-volume dimensions added by IMP-039 SCOPE-3: `maxSingleToolResultBytes` and `maxCumulativeToolResultBytes` (largest and total retained tool result, measured from `stdoutBytes` + `stderrBytes` in `.specify/runtime/tool-calls.jsonl`, no adapter required), plus `maxPromptTokensPerRequest` and `maxCumulativePromptTokens` (measurable ONLY through a configured usage adapter under `bubbles/adapters/usage/`, default `none`). The first three count EVENTS; the last four bound the VOLUME of text a session carries forward, which is the blind spot that let a session hold every event cap while replaying megabytes of retained output into each later request. DEFAULT-OFF for every existing repo: if the session file has no `sessionBudget`, or EVERY cap is null/absent, the guard exits 0 and nothing is enforced. A dimension whose cap is null is not enforced; a dimension whose cap is set but whose usage data is absent (no `turnSnapshots[]`, no `toolCallCount`, no tool-call log, no usage adapter) is skipped — you cannot breach what you cannot measure, and a token dimension is never estimated. Only when a non-null cap is present AND its aggregate is measurable does the guard compare them. RFC3339 timestamps are parsed with jq's `fromdateiso8601` (not the system `date`), so wall-clock math is identical on GNU (WSL/Linux) and BSD (macOS) userland. Enforced mechanically by `bubbles/scripts/session-cap-guard.sh` (exit 0 = no active budget / no cap exceeded; exit 1 = an active aggregate cap exceeded — stderr names the breached dimension(s) and observed-vs-cap; exit 2 = unparseable session.json / non-integer cap or counter / bad usage). State-transition-guard.sh invokes this guard as Check 40 (a NO-OP when no budget is recorded). Exceeding a cap MUST emit a `blocked` RESULT-ENVELOPE with finding `G128` and STOP the session (no further specs/scopes). There is NO `--skip`/`--force`/`--ignore` bypass (matches G082). Hermetic selftest: `bubbles/scripts/session-cap-guard-selftest.sh`. Persistent regression: `tests/regression/test_22_session_cap_enforcement.sh`. Wired into `bubbles/scripts/framework-validate.sh` (selftest + live guard). Cross-reference: G082 (per-spec convergence cap) — G082 keeps a single spec's loop honest; G128 keeps the whole session's aggregate honest. Reference: improvements/IMP-003-autonomy-dial-and-safety-caps.md (SCOPE-2), IMP-039 SCOPE-3 (context-volume dimensions).

  # ──────────────────────────────────────────────────────────────────────────
  # DOMAIN-INVARIANT CORRESPONDENCE GATE (G130)
  # Introduced with IMP-106 SCOPE-1 (DOM-INVARIANT). Advisory-until-configured
  # sibling of G097: reuses the warn-and-require-justification design for product
  # DOMAIN INVARIANTS declared in an OPTIONAL `domainModel:` block. Enforced by
  # bubbles/scripts/domain-invariant-guard.sh.
  # ──────────────────────────────────────────────────────────────────────────
  G130:
    since: "7.20.3"
    sinceDate: "2026-07-27"
    name: domain_invariant_correspondence_gate
    classification: hybrid
    enforcedBy: [ script:bubbles/scripts/domain-invariant-guard-selftest.sh, script:bubbles/scripts/domain-invariant-guard.sh ]
    description: >-
      ADVISORY-UNTIL-CONFIGURED gate (warn-and-require-justification) — the domain-invariant sibling of G097. INERT unless a repo declares an OPTIONAL `domainModel:` block in `.github/bubbles-project.yaml` (a sibling of `traceContracts:`), inline OR as `domainModel: { $ref: config/domain-model.yaml }`; a repo with no `domainModel:` block (including the Bubbles source repo) is a CLEAN NO-OP (exit 0), so adopting this gate is opt-in. Reuses the proven G097 warn-and-require-justification design, applied to PRODUCT DOMAIN INVARIANTS: where G097 asks "a requirement names PKCE/OAuth2/HMAC — does the code implement it?", G130 asks "a domainModel declares a business invariant (e.g. Order.status ∈ {created,paid,shipped,refunded}) — is it mechanically ANCHORED, or just prose?". G021 verifies a command RAN, G028 verifies a real call is MADE, and traceability-guard verifies a test EXISTS — none verify that a declared invariant is enforced or that a violating value is rejected. For each entry in `domainModel.invariants`, the guard clears it by ANY of: (a) code evidence of an `enforcedBy` mechanism token in the scope's declared implementation files (the same backtick-path extraction as G028/G097, `.sql` migrations included), (b) at least one linked `provedBy` test that is a genuine ADVERSARIAL assertion — one that rejects the violating input (a reject/rejected/invalid/`must fail`/`second_..._rejected`/negative-assertion pattern in the named test or its file), or (c) an explicit disclosure — a `## Domain-Invariant Justifications` section (in `spec.md` or `report.md`) or an `Invariant-Justification: <INV-id> — <reason>` line. Only an invariant with NEITHER enforcement NOR an adversarial proving test NOR a justification is a finding — honest disclosure over mechanical green: a legitimately-external or deferred invariant is cleared by one line. Parsing prefers mikefarah `yq` (v4) and degrades gracefully to a bounded awk/grep fallback for the canonical flow-style and simple block-style invariant declarations. GRANDFATHER CLAUSE: specs whose `state.json.createdAt` is absent or earlier than 2026-07-27 are WARN-only so adopting this gate never retroactively blocks already-closed work; only specs created on/after the cutoff get blocking enforcement. Enforced mechanically by `bubbles/scripts/domain-invariant-guard.sh`, which exits 0 (clean / not applicable / no domainModel / grandfathered), 1 (G130 finding), or 2 (runtime error / malformed input). State-transition-guard.sh invokes this guard as delegated tail Check 41 (skipped in the selftest fast path exactly like G097). Hermetic selftest: `bubbles/scripts/domain-invariant-guard-selftest.sh`. Persistent regression: `tests/regression/test_34_domain_invariant.sh`. Wired into `bubbles/scripts/framework-validate.sh` (selftest run_check). There is NO `--skip`/`--force`/`--ignore` bypass; a new anchored state is declared in the `domainModel`, never skipped. Reference: improvements/IMP-106-product-domain-ontology-and-invariant-anchoring.md (SCOPE-1).

  # ──────────────────────────────────────────────────────────────────────────
  # DOMAIN-MODEL CONSISTENCY GATE (G131)
  # Introduced with IMP-106 SCOPE-2 (DOM-SST). Advisory-until-configured
  # consistency NUDGE (the DOM-SST sibling of G130) that threads the shared
  # product-domain SST (the OPTIONAL `domainModel:` block delivered by G130)
  # through a feature's own artifacts, and feeds G044 a structured model. Blocks
  # ONLY under the `domainModelConsistencyGuard: block` opt-in. Enforced by
  # bubbles/scripts/domain-model-consistency.sh.
  # ──────────────────────────────────────────────────────────────────────────
  G131:
    since: "7.20.3"
    sinceDate: "2026-07-27"
    name: domain_model_consistency_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/claim-source-lint.sh, script:bubbles/scripts/domain-model-consistency-selftest.sh, script:bubbles/scripts/domain-model-consistency.sh ]
    description: >-
      ADVISORY-UNTIL-CONFIGURED consistency NUDGE — the DOM-SST sibling of G130 — that threads the always-available PRODUCT-DOMAIN SST through a feature's own artifacts. INERT unless a repo declares the OPTIONAL `domainModel:` block in `.github/bubbles-project.yaml` (the same sibling-of-`traceContracts:` block G130 consumes), inline OR as `domainModel: { $ref: config/domain-model.yaml }`; a repo with no `domainModel:` block (including the Bubbles source repo) is a CLEAN NO-OP (exit 0). Where G130 asks whether a declared invariant is mechanically anchored, G131 asks the sibling coherence question: does this feature keep its domain declarations IN SYNC with the shared product-domain model, or is it siloing a per-feature model that should be promoted up? For an opted-in repo it NUDGES when: (1) a feature's `design.md ## Data Model` declares an entity NOT present in the shared `domainModel.entities` — promote the entity into the shared model so every feature references one source of truth instead of a siloed per-feature model; and (2) an Outcome-Contract Hard Constraint (in `spec.md`/`design.md`) references an `INV-*` id NOT declared in the shared `domainModel.invariants` — declare it in the shared model so Gate G130 can check it is enforced-by-code or proved-by an adversarial test. ADVISORY BY DEFAULT even when configured: findings are printed and the guard exits 0, so it never breaks a currently-green tree; it exits non-zero (blocks) ONLY when a repo explicitly sets `domainModelConsistencyGuard: block` in `.github/bubbles-project.yaml` — the SAME advisory-until-opt-in shape as the G072 `claim-source-lint.sh` `claimSourceProvenanceGuard: block` key. FEEDS G044 A STRUCTURED MODEL: the cross-spec regression conflict sweep (`agents/bubbles_shared/e2e-regression.md`) can now diff a spec's declared transition against the shared `domainModel` state machine (a structured target) instead of only grepping prose for contradictory business rules. Parsing prefers mikefarah `yq` (v4) and degrades to a bounded awk/grep fallback that reads the block-style `entities:` map keys and `invariants[].id` values, staying silent (no false nudge) on a shape it cannot parse. There is NO `--skip`/`--force`/`--ignore` bypass; a new promoted entity/invariant is declared in the shared `domainModel`, never skipped. Enforced mechanically by `bubbles/scripts/domain-model-consistency.sh`, which exits 0 (clean / not applicable / no domainModel / advisory-with-findings), 1 (findings AND the `domainModelConsistencyGuard: block` opt-in is set), or 2 (runtime error / malformed input). Companion threading is additive and weakens no existing gate: `agents/bubbles_shared/capability-foundation.md` generalizes its layer-ownership table to the always-available product-domain SST, `agents/bubbles_shared/feature-templates.md` notes the `## Data Model` should reference/extend the shared model, and `agents/bubbles_shared/e2e-regression.md` feeds G044 the structured model. Hermetic selftest: `bubbles/scripts/domain-model-consistency-selftest.sh`. Wired into `bubbles/scripts/framework-validate.sh` (selftest run_check) and invoked as delegated tail Check 42 (advisory-safe — the tail wrapper surfaces nudges but the guard self-gates blocking via the opt-in, so it NEVER blocks a repo that has not set `domainModelConsistencyGuard: block`). Reference: improvements/IMP-106-product-domain-ontology-and-invariant-anchoring.md (SCOPE-2).

  # ──────────────────────────────────────────────────────────────────────────
  # REFERENCE EXISTENCE GATE (G132)
  # The mechanical half of the No Phantom References rule in
  # agents/bubbles_shared/claim-grounding.md. Advisory-until-opt-in path
  # checker. Enforced by bubbles/scripts/reference-existence-lint.sh.
  # ──────────────────────────────────────────────────────────────────────────
  G132:
    since: "7.22.0"
    sinceDate: "2026-08-02"
    name: reference_existence_gate
    classification: modelCompensation
    retireWhen: { minTier: opus-class, metric: phantom-reference-rate, threshold: 0.005, window: 50 }
    enforcedBy: [ script:bubbles/scripts/reference-existence-lint-selftest.sh, script:bubbles/scripts/reference-existence-lint.sh ]
    description: >-
      ADVISORY-UNTIL-OPT-IN gate enforcing the mechanical half of the No Phantom References rule in `agents/bubbles_shared/claim-grounding.md`. A phantom reference is a citation to a path that does not exist — a script, shared module, skill, spec directory, or doc the agent never confirmed. It is the most damaging ungrounded claim because it READS as verified evidence and it PROPAGATES: a later agent treats the citation as established and builds on it. This failure mode is observed, not hypothetical — `agents/bubbles_shared/operating-baseline.md` carries a section marked "DO NOT ACT ON THIS SECTION. Its premise was disproven", and `improvements/INDEX.md` records a withdrawn scope whose premise was "falsified against source". DIVISION OF LABOR: G021 verifies a claimed COMMAND actually ran, G072 tags HOW an evidence block supports its claim, and `bubbles/scripts/gate-id-grep.sh` resolves GATE ID references against the canonical set — none of them verify that a cited PATH exists. G132 owns path references. WHAT IS CHECKED: relative markdown link targets, resolved against the directory of the file carrying the link; a target that exists as neither a file nor a directory is a finding. DELIBERATELY NOT CHECKED (false positives bury real findings, and a lint that cries wolf gets ignored): external schemes (`http:`, `mailto:`, any scheme — this gate never makes a network call), absolute paths (unresolvable across a source checkout versus a downstream install root), bare `#anchor` links, placeholder targets containing `< > { } $ *` such as `specs/<NNN-feature-name>/spec.md`, fenced code blocks, inline code spans, and bare backticked paths (a path like `.github/bubbles/scripts/cli.sh` is frequently a DOWNSTREAM projection that correctly does not exist in the source checkout). REUSABLE BY DESIGN: the scan surface is a caller-supplied argument with NO default, following the `macos-portability-guard.sh` and `technical-prose-lint.sh` precedent — the tool is never implicitly pointed at a whole repository. ESCAPE HATCH: a genuinely intentional dangling link is exempted inline with `ref-ok:<reason>` on the same line; there is no `--skip`, no `--force`, and no allowlist file. ADVISORY BY DEFAULT: findings print and the guard exits 0, so it can never break a currently-green tree or reject historical artifacts; it exits non-zero ONLY when a repo sets `referenceExistenceGuard: block` in `.github/bubbles-project.yaml` — the SAME advisory-until-opt-in shape as the G072 `claimSourceProvenanceGuard: block` key. Exit codes: 0 (clean, or findings in advisory mode), 1 (findings AND the block opt-in is set), 2 (usage or environment error). LIMIT (stated honestly): the lint catches dead paths; it cannot catch a reference that resolves to a real file whose CONTENT does not support the claim — that half stays the agent's obligation under `claim-grounding.md`. Hermetic selftest: `bubbles/scripts/reference-existence-lint-selftest.sh` (25 cases including three adversarial groups: a broken link beside a valid one on the same line, two fixtures identical except for whether the target exists, and a real link after a closed fenced block). Wired into `bubbles/scripts/framework-validate.sh` as a selftest run_check plus a live self-only scan of the claim-bearing governance surfaces.
  G133:
    since: "7.23.0"
    sinceDate: "2026-08-06"
    name: collected_test_count_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/collected-test-count-guard.sh, script:bubbles/scripts/collected-test-count-guard-selftest.sh ]
    description: >-
      Refuses test evidence that proves nothing. A downstream e2e suite executed ZERO tests for 15 days (2026-07-21 to 2026-08-05) while twelve spec commits recorded passing-looking evidence in that window. Nothing caught it: the runner exited non-zero, which reads as ordinary test failure, and the Execution Evidence Standard was satisfied because raw output from a broken runner is still raw output. Thirteen anti-fabrication gates and a >=10-line raw-output rule did not close this, because the missing assertion was never "is there output" but "did any test actually run". Scans ONLY text inside fenced code blocks, which is what separates captured runner output from prose; an earlier prose-scanning version used a keyword window that was circular, since the sentence "No tests found in this area were affected" supplied its own context word. Inside a fence, an explicit collection-zero signal from jest, playwright, pytest, go, cargo, vitest, mocha or node --test is a finding. The pattern set is deliberately small because generic patterns drown the signal: bare "0 total" matched jest's "Snapshots: 0 total" 354 times in one repo, bare "0 passed" matched the tail of "10 passed" (2,133 false hits on the first run), "Tests:" without a word boundary matched "linkedTests: 0", and "Tests: 0" without requiring a total matched "Tests: 0 failed, all passed", which is a PASS. Go's per-package "ok <pkg> [no tests to run]" is routine and excluded on purpose. Evidence with no recognisable count is NOT failed, because runner formats vary too widely for absence to be proof and a guard that fails on every unknown format gets bypassed rather than fixed. RATCHET: a first scan across six repos found 23 genuine hits, some legitimate because a bug's REPRODUCTION section is supposed to show failing output (three sit in bugs named missing-test-files-false-certification, disabled-fake-tests and systemic-e2e-xfail-ephemeral-fabrication, where the zero-test output IS the evidence). The guard cannot tell a reproduction from a passing claim, so existing hits are frozen in a PER-REPO baseline at `<repo>/.specify/collected-test-count-guard.baseline` and only NEW ones fail; the baseline may shrink, never grow. The baseline is deliberately NOT shipped beside the script: downstream this script installs under `.github/bubbles/scripts/`, which `downstream-framework-write-guard.sh` forbids the consuming repo from editing, so a baseline there could never be updated by its owner, and a framework-side baseline would accumulate downstream spec paths (the first attempt leaked an operator-linked location into the portable tree). Each consuming repo generates its own with `--update-baseline` on adoption. Exits 0 (clean or baseline updated), 1 (new zero-test evidence), or 2 (usage error or a bypass-shaped flag). There is NO --skip/--force/--ignore bypass; evidence that proves nothing is fixed by re-running the suite, never by suppressing the check. Hermetic selftest: `bubbles/scripts/collected-test-count-guard-selftest.sh` (16 checks, including a replay of the real outage shape and six adversarial false-positive cases). Wired into `bubbles/scripts/framework-validate.sh` (selftest run_check). Reference: improvements/IMP-036 (SCOPE-3).
  G134:
    since: "7.25.0"
    sinceDate: "2026-08-09"
    name: goal_fidelity_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/goal-fidelity-guard.sh, script:bubbles/scripts/goal-fidelity-guard-selftest.sh ]
    description: >-
      Makes the IMP-038 goal-fidelity capabilities load-bearing. goal-contract.sh can freeze and verify a goal, work-boundary-resolve.sh can refuse an undeclared boundary, and the envelope validator can refuse dishonest finding accounting — but none of them is REACHED unless a runner chooses to call it, so a run that simply never called them passed everything. This gate checks the six boundaries where drift actually enters, each independently selectable so a caller pays only for the one it is standing on. `pre-planning`: the contract exists, is schema-valid, is frozen (an unfrozen contract can be edited afterwards to match whatever the run did), and names a repository. `post-planning`: spec.md carries a non-empty Outcome Contract, state.json declares a workBoundary, and execution.goalContractRef points at the SAME goal the session holds. `pre-dispatch`: the candidate repository, spec and path resolve in-boundary under strict mode, and any supplied goalRef carries the current digest. `post-finding`: no changed path fell outside the declared boundary — handling a finding never authorizes editing outside the approved reach, which is the specific way a bounded run turns into an unbounded one. `post-compaction`: the resumed goalRef still matches, so a resume cannot silently continue against a superseded revision. `pre-certification`: report.md references the declared Success Signal, Hard Constraints were stated, and the spec is not certifying against a revision the session has already superseded. Also carries the G070 repair for ordinary feature work (see that gate). Exits 0 (all selected boundaries held), 1 (a boundary failed, findings printed one per line), or 2 (usage error). There is NO --force/--skip/--ignore: a boundary that cannot be satisfied is narrowed, or expanded through `goal-contract.sh revise --approval-note` with recorded operator approval. Hermetic selftest: `bubbles/scripts/goal-fidelity-guard-selftest.sh` (39 cases, each pairing a green fixture with its drifted variant). Reference: improvements/IMP-038 (SCOPE-6).
  G135:
    since: "7.25.0"
    sinceDate: "2026-08-10"
    name: autonomy_posture_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/autonomy-posture-guard.sh, script:bubbles/scripts/autonomy-posture-guard-selftest.sh ]
    description: >-
      Keeps the IMP-039 autonomy posture surface internally consistent. That spec shipped a resolvable dial (SCOPE-1), a corrected enum (SCOPE-2), an opt-in `unattended` (SCOPE-3), a never-suppressible floor (SCOPE-4), a decision ledger (SCOPE-5) and posture persistence (SCOPE-6) — but each is only as good as its NEXT edit, and AUT-2 was precisely a declaration describing behavior the implementation did not have. Nothing stopped that recurring. This gate checks the four places drift actually enters. (1) The never-suppressible floor still exists AND still enumerates its six items, so the section cannot be hollowed out while its heading survives — the subtler regression, because a present heading reads as an intact policy. (2) The `executionOptions.optionalWorkflowTags.autonomy` enum and the resolver's VALID_AUTONOMY agree exactly, in BOTH directions: a posture declared but not implemented is the AUT-2 shape, and a posture implemented but not declared is undocumented behavior. (3) `unattended` with an unbounded session budget is still refused with exit 3 AND still names E039-UNATTENDED-UNBOUNDED, because an unnamed refusal is not actionable; and `unattended` with a bounded budget still resolves, so the rule cannot be satisfied by refusing everything. (4) The resolver still refuses every bypass flag, so the posture can never begin waiving verification. Exits 0 (consistent), 1 (findings, one per line), or 2 (usage). There is NO --force/--skip/--ignore: a posture that cannot satisfy the floor is changed, never exempted. Hermetic selftest: `bubbles/scripts/autonomy-posture-guard-selftest.sh` (15 cases, each pairing the green fixture with a drifted variant, including a resolver that silently accepts a bypass flag and a floor hollowed out behind an intact heading). Reference: improvements/IMP-039 (SCOPE-7).
  G136:
    since: "7.26.0"
    sinceDate: "2026-08-13"
    name: human_acceptance_terminal_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/guards/tail-delegated-gates.sh, script:bubbles/scripts/state-transition-guard-selftest.sh, script:tests/regression/test_35_human_acceptance_terminal.sh ]
    description: >-
      Refuses a terminal transition while any acceptance item in `uservalidation.md` is still unchecked. The hole this closes is narrow and was load-bearing: `artifact-lint.sh` requires the checklist to carry at least ONE checked `[x]` entry and never rejects an unchecked one, so a checklist of one checked item and five unchecked passes lint and the spec reaches a terminal status with five behaviors no human ever accepted. Lint is the WRONG place to repair that, which is why the repair lives here instead. Lint also runs during planning, where a checked-by-default template is legitimate — the template records what WILL be accepted, it does not claim a human already ran it — so tightening lint would either break planning or force planning to fabricate acceptance up front. The terminal transition is the moment the claim stops being provisional, so that is where it is checked. SCOPE. Runs only when the resolved target status is `done`; a ceiling-bound mode (validate-only, docs-only, spec-scope-hardening and the rest) is not claiming human acceptance of delivered behavior, and an open checklist is the correct state for it rather than a violation. Parses ONLY the `## Checklist` section, using the same awk section reader `artifact-lint.sh` uses, so the two agree on what the checklist IS and a later edit to one cannot silently desync the other; a `[ ]` bullet under `## Notes` is ignored on purpose. THE GUARD NEVER EDITS THE FILE. It prints each unaccepted item and stops. Checking a box on the author's behalf would fabricate exactly the human acceptance the gate exists to require, which is the one failure mode that would make the gate worse than not having it. Either a human accepts the behavior and checks it, or the item is a real regression and the spec is not done. Exits are the guard's own: the check fails the transition, it has no separate exit code and no `--force`/`--skip`/`--ignore`. Selftest: two cases in `bubbles/scripts/state-transition-guard-selftest.sh` — the BUG-029 shape itself (one checked plus one unchecked, which must be detected) and its adversarial partner (a fully checked list reports nothing, and a `[ ]` outside the Checklist section is ignored, proving the section parser does not over-reach). Reference: improvements/IMP-040 (SCOPE-10), BUG-029.
