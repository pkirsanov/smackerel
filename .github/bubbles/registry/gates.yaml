  G087:
    since: "5.2.0"
    sinceDate: "2026-06-04"
    name: planning_packet_implementation_linkage_gate
    classification: businessInvariant
    enforcedBy: [ script:bubbles/scripts/planning-packet-linkage-guard-selftest.sh, script:bubbles/scripts/planning-packet-linkage-guard.sh ]
    description: >-
      BLOCKING gate. Hardened planning packets MUST NOT remain orphaned from implementation. A `state.json` with top-level `status == "specs_hardened"` MUST resolve to exactly ONE of three truthful dispositions: (1) `linkedImplementationSpec` points to a real spec directory containing `state.json`; (2) `planningOnly: true` with a non-empty `planningOnlyJustification`, asserting no implementation will follow; (3) `deliveryTopology: "in-place"` with a `deliveryTopologyJustification` of at least 20 characters, asserting the packet plans AND implements in the same directory so there is no separate spec to name. Disposition (3) exists because a packet with that topology could satisfy neither original exit without asserting something false — a gate whose only exits are lies selects which lie gets told rather than enforcing an invariant. An ABSENT `deliveryTopology` resolves to `two-spec`, so the field is strictly additive and cannot newly fail a packet that passed before it existed. The three are mutually exclusive: `planningOnly:true` together with `deliveryTopology:in-place` fails, as does `in-place` combined with a `linkedImplementationSpec`; an unrecognised `deliveryTopology` value fails rather than being treated as a satisfier. If the linked implementation spec is `status == "done"`, its `linkedPlanningPacket` MUST point back to the hardened planning packet. Dangling implementation pointers fail, and implementation targets with `status == "archived"` are invalid active targets; the owner must relink to a non-archived implementation spec or classify the packet under one of the other two dispositions. Enforced mechanically by `bubbles/scripts/planning-packet-linkage-guard.sh`, which exits 0 (clean), 1 (G087 findings), or 2 (runtime error / malformed input). WIRING: `state-transition-guard.sh` does NOT invoke this guard directly — grepping that file for the guard returns zero, which reads as an unwired gate. The invocation is delegated to `bubbles/scripts/guards/tail-delegated-gates.sh`, which the state-transition guard sources. Hermetic selftest: `bubbles/scripts/planning-packet-linkage-guard-selftest.sh` (45 assertions, including a non-vacuity case proving an explicit `two-spec` packet still fails without linkage). Persistent regression: `tests/regression/test_10_planning_packet_linkage.sh`. Wired into `bubbles/scripts/framework-validate.sh`.
  G088:
