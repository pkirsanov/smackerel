  - G112 # backup_evidence_required_gate
  - G113 # restore_drill_evidence_gate
  - G114 # bcdr_evidence_gate
  - G130 # domain_invariant_correspondence_gate

priorityScoring:
  model: weighted_sum
  scoreRange:
    min: 0
    max: 100
  weights:
    userImpact: 25
    deliveryBlocker: 20
    experientialFriction: 10
    complianceRisk: 15
    regressionRisk: 10
    readiness: 10
    effortInverse: 10
  dimensions:
    userImpact:
      scale: 0-5
      guidance:
        5: user-facing regression or core journey break
        3: high-value workflow degradation
        1: minor operator inconvenience
    deliveryBlocker:
      scale: 0-5
      guidance:
        5: blocks required gate or release progression
        3: blocks one scope while alternatives exist
        1: non-blocking issue
    experientialFriction:
      scale: 0-5
      guidance:
        5: user-reported core-journey friction blocking goal completion
        3: repeated confusion on a high-value flow
        1: minor polish
    complianceRisk:
      scale: 0-5
      guidance:
        5: security/compliance/audit failure likely
        3: policy drift risk
        1: low compliance relevance
    regressionRisk:
      scale: 0-5
      guidance:
        5: likely to produce widespread regressions
        3: localized regression potential
        1: low regression risk
    readiness:
      scale: 0-5
      guidance:
        5: scope/design/spec ready to execute now
        3: partial readiness, small bootstrap needed
        1: underdefined, heavy bootstrap required
    effortInverse:
      scale: 0-5
      guidance:
        5: small effort, high return
        3: medium effort, medium return
        1: large effort before value realized
  tieBreakers:
  - highest_deliveryBlocker
  - highest_userImpact
  - highest_experientialFriction
  - highest_readiness
  - lowest_effort
  - stable_sort_by_spec_id

