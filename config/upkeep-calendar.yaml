# Smackerel upkeep calendar
# Owned by bubbles.upkeep. Engine: knb/shared/upkeep/upkeep-engine.sh
version: 1
tasks:
- id: backup
  cadence: daily
  at: "04:30"
  retention: "30d"
- id: restore-test
  cadence: weekly
  at: "sun 05:00"
  retention: "90d"
  blocks_on_failure: [ release-train-promote ]
- id: bcdr-drill
  cadence: quarterly
  retention: "5y"
  # requires_offsite_backend: true => this drill only activates once an offsite backend exists.
  # Today release-trains.yaml offsite_required: false => offsite/BCDR is WARN-only (G114/G116 warn, not block).
  # Operator flips offsite_required: true after provisioning T3/T4 hardware; this drill then becomes live.
  requires_offsite_backend: true
- id: patch-cycle
  cadence: monthly
  at: "first-sun 06:00"
  retention: "1y"
- id: secret-rotation
  cadence: quarterly
  retention: "5y"
- id: flag-cleanup-audit
  cadence: monthly
  retention: "1y"
- id: corpus-grant-observe-review
  # Spec 108 §18 decision 1(b): the corpus-grant ENFORCE flip is authorised only
  # after >= 14 CONSECUTIVE OBSERVE days with per-principal x per-route-group
  # coverage across all sixteen route groups.
  #
  # DAILY, not weekly, for two reasons: the window is measured in days, and it
  # RESETS TO DAY ZERO on any new principal enrollment or new client surface. A
  # weekly cadence could miss a reset for six days and then miscount the window
  # as satisfied — the exact failure the ratified bar exists to prevent.
  #
  # Procedure: docs/Operations.md -> "Corpus-grant OBSERVE window review".
  # Only meaningful while corpusGrantEnforcement is OFF; once the flag flips the
  # window is moot and this task retires with the flag.
  cadence: daily
  at: "06:30"
  retention: "1y"
  blocks_on_failure: [ release-train-promote ]
- id: compliance-sweep
  cadence: quarterly
  retention: "7y"
