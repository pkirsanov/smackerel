# Smackerel release trains
# Owned by bubbles.train. Validated by bash .github/bubbles/scripts/release-train-guard.sh

version: 1

defaults:
  retention: "7d-daily,4w-weekly,12m-monthly"
  pii: "encrypted-only" # Smackerel ingests personal knowledge; treat as PII-sensitive
  # Cross-ref: config/upkeep-calendar.yaml bcdr-drill (requires_offsite_backend: true)
  # stays dormant while this is false; G114/G116 warn, not block. Flip true after provisioning T3/T4.
  offsite_required: false # WARN today (RAID5). Flip when T3/T4 ready.

trains:
- id: mvp
  phase: active
  # Abstract slot only. The guard's vocabulary also admits a concrete
  # operator-target name, but naming it here would violate the
  # product-deployment-boundary policy (rule PRODUCT_CONCRETE_TARGET), which is
  # fail-closed in pre-push and CI. `prod` is the correct abstraction: this is
  # smackerel's live slot, and WHICH machine serves it is knb's business.
  # "self-hosted" is this repo's ENVIRONMENT name (./smackerel.sh --env=self-hosted,
  # config bundles), not a release-train slot; the two axes are distinct. The
  # concrete binding (hostname, IP, tailnet identity, Caddy/systemd fragments,
  # per-target manifest) lives ONLY in the knb deploy-adapter overlay, never here.
  # Nothing in knb consumes this field; it is release metadata, not a deploy input.
  target_slot: prod
  flags_bundle: config/feature-flags.mvp.yaml
  description: "Current self-hosted train (ingest + digest + delivery foundation)"

- id: next
  phase: active
  target_slot: staging
  flags_bundle: config/feature-flags.next.yaml
  description: "Next promotion candidate (synthesis + multi-source coordination)"
