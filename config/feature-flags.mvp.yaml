# Smackerel mvp train flag bundle
version: 1
train: mvp
flags:
  # Default-ON in this (owning) train; default-OFF in every other train (G111).
  card_rewards: true
  # Spec 085 — Lane B (Play Store) client release. Default-OFF (dormant) in EVERY
  # train; bubbles.train flips it ON in exactly one owning train ONLY when the
  # operator activates public-store submission. While false it never auto-runs.
  clientReleaseLaneB: false
  # Spec 108 — corpus grant enforcement OBSERVE→ENFORCE switch. Owned by train
  # 'next' (specs/108-corpus-grant-enforcement/); default-OFF in EVERY train per
  # R-108-FL3. 'mvp' observes and counts would-be denials, and never denies.
  corpusGrantEnforcement: false
metadata:
  card_rewards:
    owning_spec: specs/083-card-rewards-companion/
    introduced_in_train: mvp
    introduced_at: "2026-06-12"
  clientReleaseLaneB:
    owning_spec: specs/085-client-binary-release/
    introduced_in_train: mvp
    introduced_at: "2026-06-12"
  corpusGrantEnforcement:
    owning_spec: specs/108-corpus-grant-enforcement/
    introduced_in_train: next
    introduced_at: "2026-08-11"
